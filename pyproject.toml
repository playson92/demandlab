[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "demandlab"
version = "0.1.0"
description = "Leakage-aware recorded-sales forecasting and inventory simulation"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2", "numpy>=2", "streamlit>=1.57", "plotly>=6", "pyarrow>=19"]

[project.optional-dependencies]
research = ["duckdb>=1.3", "scikit-learn>=1.6", "mlflow>=3", "openpyxl>=3.1", "requests>=2.32", "psutil>=6", "threadpoolctl>=3"]
dev = ["pytest>=8", "ruff>=0.15", "playwright>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
