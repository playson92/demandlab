[theme]
base = "light"
primaryColor = "#247452"
backgroundColor = "#F5F3ED"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#29332E"
font = "Arial, sans-serif"
borderColor = "#D8DDD4"
baseRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 14
headingFontSizes = ["30px", "24px", "20px", "18px", "16px", "14px"]
chartCategoricalColors = ["#247452", "#936120", "#5264A1"]
[theme.sidebar]
backgroundColor = "#ECEFE7"
secondaryBackgroundColor = "#FFFFFF"
[server]
headless = true
[browser]
gatherUsageStats = false
