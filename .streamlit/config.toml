[theme]
base = "dark"
primaryColor = "#0f8f82"
backgroundColor = "#0c1426"
secondaryBackgroundColor = "#15223b"
textColor = "#e7edf7"
font = "sans-serif"
borderColor = "#293956"
baseRadius = "10px"
showWidgetBorder = true
chartCategoricalColors = ["#14b8a6", "#648cff", "#f4a261", "#d6dce8"]
headingFontSizes = ["36px", "28px", "22px", "18px", "16px", "14px"]

[theme.sidebar]
backgroundColor = "#111c32"
secondaryBackgroundColor = "#1c2c48"

[server]
headless = true

[browser]
gatherUsageStats = false
